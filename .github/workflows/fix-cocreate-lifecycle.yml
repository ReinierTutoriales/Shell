name: Fix CoCreateInstance lifecycle
on:
  push:
    paths: ['.github/workflows/fix-cocreate-lifecycle.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Align COM detour attach and detach lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dll/src/Main.cpp')
          s=p.read_text(encoding='utf-8-sig')
          old='''\t\t\t\t\t_CoCreateInstance.Begin();\n\t\t\t\t\t//_DllGetClassObject.init(hModule, "DllGetClassObject", DllGetClassObjectHook).hook();\n\t\t\t\t\t_CoCreateInstance.init(::CoCreateInstance, CoCreateInstanceHook).hook();\n\t\t\t\t\t//auto m = &_detours_ci[hModule];\n\t\t\t\t\t//if(!m->installed())\n\t\t\t\t\t//m->init(hModule, "api-ms-win-core-com-l1-1-0.dll", ::CoCreateInstance, CoCreateInstanceProc).install();\n\t\t\t\t\t_CoCreateInstance.Commit();\n'''
          new='''\t\t\t\t\tif(NO_ERROR == _CoCreateInstance.Begin())\n\t\t\t\t\t{\n\t\t\t\t\t\t//_DllGetClassObject.init(hModule, "DllGetClassObject", DllGetClassObjectHook).hook();\n\t\t\t\t\t\t_CoCreateInstance.init(::CoCreateInstance, CoCreateInstanceHook).hook();\n\t\t\t\t\t\t//auto m = &_detours_ci[hModule];\n\t\t\t\t\t\t//if(!m->installed())\n\t\t\t\t\t\t//m->init(hModule, "api-ms-win-core-com-l1-1-0.dll", ::CoCreateInstance, CoCreateInstanceProc).install();\n\t\t\t\t\t\tif(NO_ERROR != _CoCreateInstance.Commit())\n\t\t\t\t\t\t\t_CoCreateInstance._installed = false;\n\t\t\t\t\t}\n'''
          if s.count(old)!=1: raise SystemExit(f'attach block count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''\t\t\t\t\tif(ver->IsWindows11OrGreater())\n\t\t\t\t\t{\n\t\t\t\t\t\t_CoCreateInstance.Begin();\n\t\t\t\t\t\t//_DllGetClassObject.unhook();\n\t\t\t\t\t\t_CoCreateInstance.unhook();\n\t\t\t\t\t\t_CoCreateInstance.Commit();\n\t\t\t\t\t}\n'''
          new='''\t\t\t\t\tif(_CoCreateInstance.is_hooked() && NO_ERROR == _CoCreateInstance.Begin())\n\t\t\t\t\t{\n\t\t\t\t\t\t//_DllGetClassObject.unhook();\n\t\t\t\t\t\t_CoCreateInstance.unhook();\n\t\t\t\t\t\tif(NO_ERROR != _CoCreateInstance.Commit())\n\t\t\t\t\t\t\t_CoCreateInstance._installed = true;\n\t\t\t\t\t}\n'''
          if s.count(old)!=1: raise SystemExit(f'detach block count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='')
          PY
          git diff --check
          git diff -- src/dll/src/Main.cpp
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dll/src/Main.cpp
          git commit -m 'fix: align CoCreateInstance detour lifecycle'
          git pull --rebase origin main
          git push origin HEAD:main
