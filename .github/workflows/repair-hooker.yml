name: Repair Hooker header
on:
  push:
    paths: ['.github/workflows/repair-hooker.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore and remove dead helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git show 17e099cff2e69d875c73756614279e75f29fc6e6:src/dll/src/Include/Hooker.h > src/dll/src/Include/Hooker.h
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dll/src/Include/Hooker.h')
          s=p.read_text(encoding='utf-8-sig')
          block='''\n\t\ttemplate <typename T, typename... Args>\n\t\tauto invoke(Args&&... args)\n\t\t{\n\t\t\treturn reinterpret_cast<T *>(_orignal)(args...);\n\t\t}\n'''
          if s.count(block)!=1: raise SystemExit(f'invoke block count={s.count(block)}')
          s=s.replace(block,'\n')
          p.write_text(s,encoding='utf-8',newline='')
          PY
          git diff --check
          test "$(wc -l < src/dll/src/Include/Hooker.h)" -gt 300
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dll/src/Include/Hooker.h
          git commit -m 'refactor: remove unused IAT invoke helper'
          git pull --rebase origin main
          git push origin HEAD:main
