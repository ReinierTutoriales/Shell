name: Cleanup D2D resources
on:
  push:
    paths:
      - '.github/workflows/cleanup-d2d-resources.yml'
permissions:
  contents: write
concurrency:
  group: cleanup-d2d-resources
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove dead D2D stroke and WND state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dll/src/Include/Initializer.h')
          s=p.read_text(encoding='utf-8')
          s=s.replace('\n\t\t\tID2D1StrokeStyle *stroke = nullptr;','',1)
          a=s.find('\n\t\t\tstatic ID2D1StrokeStyle *createStrokeStyle()')
          b=s.find('\n\t\t\tID2D1SolidColorBrush *createSolidColorBrush', a)
          if a < 0 or b < 0: raise SystemExit('stroke helper block not found')
          s=s[:a]+s[b:]
          old='''\n\t\t\t\tif(!stroke)\n\t\t\t\t\tstroke = createStrokeStyle();\n\t\t\t\treturn brush;//&& textFormat;'''
          if old not in s: raise SystemExit('stroke allocation block not found')
          s=s.replace(old,'\n\t\t\t\treturn brush;//&& textFormat;',1)
          p.write_text(s,encoding='utf-8',newline='')

          p=Path('src/dll/src/Include/ContextMenu.h')
          s=p.read_text(encoding='utf-8')
          old='\n\t\t\tD2D d2d;\n\t\t\tWND(HWND hWnd = nullptr)'
          if s.count(old)!=1: raise SystemExit(f'WND d2d count {s.count(old)}')
          s=s.replace(old,'\n\t\t\tWND(HWND hWnd = nullptr)',1)
          p.write_text(s,encoding='utf-8',newline='')
          PY
          ! grep -q 'ID2D1StrokeStyle \*stroke' src/dll/src/Include/Initializer.h
          ! grep -q 'createStrokeStyle' src/dll/src/Include/Initializer.h
          ! grep -q '^\s*D2D d2d;' src/dll/src/Include/ContextMenu.h
          git diff --check
      - name: Commit production cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/Include/Initializer.h src/dll/src/Include/ContextMenu.h
          git commit -m 'refactor: remove unused D2D menu resources'
          git pull --rebase origin main
          git push origin HEAD:main
