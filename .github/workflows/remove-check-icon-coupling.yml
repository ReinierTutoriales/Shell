name: Menu icon metric correction
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-check-icon-coupling.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/dll/src/ContextMenu.cpp')
          s=p.read_text(encoding='utf-8')
          old='''\t\t\t\t\t\t// Windows owns the default geometry for the System/Auto baseline.\n\t\t\t\t\t\t// Capture the Windows-owned check/icon slot once during initialization.\n\t\t\t\t\t\t// Item vertical spacing depends on the final menu font and remains on the\n\t\t\t\t\t\t// established path until it can be derived after font resolution.\n\t\t\t\t\t\tconst auto systemMenuCheckWidth = ::GetSystemMetricsForDpi(SM_CXMENUCHECK, dpi.val);\n\t\t\t\t\t\tconst auto systemMenuCheckHeight = ::GetSystemMetricsForDpi(SM_CYMENUCHECK, dpi.val);\n\t\t\t\t\t\tif(systemMenuCheckWidth > 0 && systemMenuCheckHeight > 0)\n\t\t\t\t\t\t\t_theme.image.size = static_cast<uint32_t>((std::min)(systemMenuCheckWidth, systemMenuCheckHeight));\n'''
          if s.count(old)!=1: raise SystemExit('check/icon coupling block mismatch')
          s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8',newline='')
      - shell: bash
        run: |
          git diff --check
          ! grep -Fq 'SM_CXMENUCHECK' src/dll/src/ContextMenu.cpp
          ! grep -Fq 'SM_CYMENUCHECK' src/dll/src/ContextMenu.cpp
          grep -Fq 'GetSystemMetricsForDpi(SM_CYMENU, dpi.val)' src/dll/src/ContextMenu.cpp
          git config user.name ReinierTutoriales
          git config user.email 86568548+ReinierTutoriales@users.noreply.github.com
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: decouple generic icons from menu check metrics'
          git push
