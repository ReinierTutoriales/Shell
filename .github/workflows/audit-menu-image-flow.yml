name: Audit native menu image flow
on:
  push:
    paths:
      - '.github/workflows/audit-menu-image-flow.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Locate native image and symbol consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== get_image / FindImage ==='
          grep -RInE 'get_image\(|FindImage\(' src/dll/src || true
          echo '=== native bitmap fields ==='
          grep -RInE 'hbmp(Item|Checked|Unchecked)' src/dll/src || true
          echo '=== check/radio/submenu render decisions ==='
          grep -RInE 'is_checked\(|is_radiocheck\(|symbols\.(checked|bullet|chevron)|hSubMenu' src/dll/src | head -n 400 || true
          echo '=== MenuItemInfo set consumers ==='
          grep -RInE '\.set\([^;]*(HMENU|menu)|->set\(' src/dll/src || true
