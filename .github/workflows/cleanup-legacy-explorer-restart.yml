name: Cleanup legacy Explorer restart
on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-explorer-restart.yml'
permissions:
  contents: write
concurrency:
  group: cleanup-legacy-explorer-restart
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify consumers and remove dead variants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(grep -RIl --exclude-dir=.git -E '\bRestart0\s*\(' src | wc -l)" -eq 1
          test "$(grep -RIl --exclude-dir=.git -E '\bRestart1\s*\(' src | wc -l)" -eq 1
          test "$(grep -RIl --exclude-dir=.git -E '\bRestart2\s*\(' src | wc -l)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/shared/System/Windows/Windows.h')
          s=p.read_text(encoding='utf-8')
          start=s.find('\n\t\t\tstatic bool Restart0()')
          end=s.find('\n\t\t\t/*\n\t\t\t\tRegRead, HiddenFilesStatus', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('legacy Restart0/1/2 block not found')
          block=s[start:end]
          for name in ('Restart0()', 'Restart1()', 'Restart2()'):
              if name not in block: raise SystemExit(f'{name} missing from block')
          s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8',newline='')
          PY
          ! grep -RIn --exclude-dir=.git -E '\bRestart[012]\s*\(' src
          grep -RIn --exclude-dir=.git -E 'Windows::Explorer::Restart\s*\(' src
          git diff --check
      - name: Commit production cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shared/System/Windows/Windows.h
          git commit -m 'refactor: remove dead Explorer restart variants'
          git pull --rebase origin main
          git push origin HEAD:main
