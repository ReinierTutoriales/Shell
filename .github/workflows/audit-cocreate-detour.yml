name: Audit CoCreateInstance detour
on:
  push:
    paths: ['.github/workflows/audit-cocreate-detour.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trace COM detour lifecycle
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn --exclude-dir=.git --exclude='audit-cocreate-detour.yml' -E '_CoCreateInstance|CoCreateInstance|DetourTransaction|\.attach\(|\.detach\(' src/dll/src src/shared | head -n 400 || true
