name: D2D begin fail-safe
on:
  push:
    paths:
      - '.github/workflows/fix-d2d-begin-failsafe.yml'
permissions:
  contents: write
concurrency:
  group: fix-d2d-begin-failsafe
  cancel-in-progress: true
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Harden D2D begin contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/dll/src/Include/Initializer.h')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\tvoid begin(HDC hdc, const Rect rect)\n\t\t\t{\n\t\t\t\tif(init_res())\n\t\t\t\t{\n\t\t\t\t\tbind(hdc, rect);\n\t\t\t\t\t//if(SUCCEEDED())\n\t\t\t\t\t{\n\t\t\t\t\t\t\n\t\t\t\t\t\trender->BeginDraw();\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n'''
          new = '''\t\t\tbool begin(HDC hdc, const Rect rect)\n\t\t\t{\n\t\t\t\tif(!init_res())\n\t\t\t\t\treturn false;\n\n\t\t\t\tconst HRESULT hr = bind(hdc, rect);\n\t\t\t\tif(FAILED(hr) || !render || !brush)\n\t\t\t\t\treturn false;\n\n\t\t\t\trender->BeginDraw();\n\t\t\t\treturn true;\n\t\t\t}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one unsafe D2D begin overload, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='')
          PY
          grep -q 'bool begin(HDC hdc, const Rect rect)' src/dll/src/Include/Initializer.h
          grep -q 'FAILED(hr) || !render || !brush' src/dll/src/Include/Initializer.h
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/Include/Initializer.h
          git commit -m 'fix: make D2D begin fail safely'
          git push origin HEAD:main
