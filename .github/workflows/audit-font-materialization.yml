name: Audit font materialization
on:
  push:
    paths: ['.github/workflows/audit-font-materialization.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Inspect font materialization and overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = ('_theme.font','font.handle','CreateFont','HFONT','lfHeight','lfMenuFont','Theme::GetFont','GetFont(')
          for p in Path('src').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.h','.hpp','.cpp','.cc','.cxx'}:
              continue
            try:
              lines=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
            except Exception:
              continue
            hits=[]
            for i,line in enumerate(lines,1):
              if any(n.lower() in line.lower() for n in needles):
                hits.append(i)
            if not hits:
              continue
            print(f'===== {p} =====')
            shown=set()
            for i in hits:
              a=max(1,i-4); b=min(len(lines),i+6)
              key=(a,b)
              if key in shown: continue
              shown.add(key)
              print(f'--- {a}-{b}')
              for j in range(a,b+1):
                print(f'{j}: {lines[j-1]}')
          PY
