name: Fix D2D fallback build
on:
  push:
    paths:
      - '.github/workflows/fix-d2d-fallback-build.yml'
permissions:
  contents: write
concurrency:
  group: fix-d2d-fallback-build
  cancel-in-progress: true
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Correct D2D fallback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dll/src/ContextMenu.cpp')
          s=p.read_text(encoding='utf-8')
          old='return wnd->msg.invoke();'
          new='return defSubclassProc();'
          if new in s and old not in s:
              print('already applied')
          elif s.count(old)==1:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8',newline='')
          else:
              raise SystemExit(f'unexpected bad fallback count: {s.count(old)}')
          PY
          grep -q 'if(!d2d.begin(wnd->hdc' src/dll/src/ContextMenu.cpp
          grep -A1 'if(!d2d.begin(wnd->hdc' src/dll/src/ContextMenu.cpp | grep -q 'return defSubclassProc();'
          ! grep -q 'wnd->msg.invoke' src/dll/src/ContextMenu.cpp
          git diff --check
      - name: Commit production correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: use subclass procedure for D2D fallback'
          git pull --rebase origin main
          git push origin HEAD:main
