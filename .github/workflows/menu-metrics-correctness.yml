name: Menu metrics correctness fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/menu-metrics-correctness.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct Windows-owned menu metric integration
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/dll/src/ContextMenu.cpp')
          s=p.read_text(encoding='utf-8')
          old='''\t\t\t\t\t\tconst auto systemMenuHeight = ::GetSystemMetricsForDpi(SM_CYMENU, dpi.val);\n\t\t\t\t\t\tconst auto systemMenuCheckWidth = ::GetSystemMetricsForDpi(SM_CXMENUCHECK, dpi.val);\n\t\t\t\t\t\tconst auto systemMenuCheckHeight = ::GetSystemMetricsForDpi(SM_CYMENUCHECK, dpi.val);\n\t\t\t\t\t\tif(systemMenuHeight > 0)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tconst auto fontHeight = std::max<long>(1, std::abs(_theme.font.lfHeight));\n\t\t\t\t\t\t\tconst auto verticalSpace = std::max<long>(0, systemMenuHeight - fontHeight);\n\t\t\t\t\t\t\t_theme.back.padding.top = verticalSpace / 2;\n\t\t\t\t\t\t\t_theme.back.padding.bottom = verticalSpace - _theme.back.padding.top;\n\t\t\t\t\t\t}\n\t\t\t\t\t\tif(systemMenuCheckWidth > 0 && systemMenuCheckHeight > 0)\n\t\t\t\t\t\t\t_theme.image.size = static_cast<uint32_t>(std::min(systemMenuCheckWidth, systemMenuCheckHeight));'''
          new='''\t\t\t\t\t\tconst auto systemMenuCheckWidth = ::GetSystemMetricsForDpi(SM_CXMENUCHECK, dpi.val);\n\t\t\t\t\t\tconst auto systemMenuCheckHeight = ::GetSystemMetricsForDpi(SM_CYMENUCHECK, dpi.val);\n\t\t\t\t\t\tif(systemMenuCheckWidth > 0 && systemMenuCheckHeight > 0)\n\t\t\t\t\t\t\t_theme.image.size = static_cast<uint32_t>((std::min)(systemMenuCheckWidth, systemMenuCheckHeight));'''
          if s.count(old)!=1: raise SystemExit('metric block mismatch')
          s=s.replace(old,new,1)
          s=s.replace('// Capture DPI-aware menu metrics once during menu initialization; explicit\n\t\t\t\t\t\t// NSS theme/view overrides are evaluated later and therefore still win.', '// Capture the Windows-owned check/icon slot once during initialization.\n\t\t\t\t\t\t// Item vertical spacing depends on the final menu font and remains on the\n\t\t\t\t\t\t// established path until it can be derived after font resolution.')
          p.write_text(s,encoding='utf-8',newline='')
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          ! grep -Fq 'systemMenuHeight' src/dll/src/ContextMenu.cpp
          grep -Fq '(std::min)(systemMenuCheckWidth, systemMenuCheckHeight)' src/dll/src/ContextMenu.cpp
          git config user.name ReinierTutoriales
          git config user.email 86568548+ReinierTutoriales@users.noreply.github.com
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: keep system menu metrics font-order safe'
          git push
