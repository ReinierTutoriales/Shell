name: Audit static library provenance
on:
  push:
    paths: ['.github/workflows/audit-lib-provenance.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Inspect pinned submodules and library provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          'SUBMODULE STATUS' | Tee-Object -FilePath provenance.txt
          git submodule status | Tee-Object -FilePath provenance.txt -Append
          '' | Tee-Object -FilePath provenance.txt -Append
          'LIBRARIES' | Tee-Object -FilePath provenance.txt -Append
          Get-ChildItem src/shared/Library/*.lib | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($_.Name)`t$($_.Length)`t$hash" | Tee-Object -FilePath provenance.txt -Append
          }
          '' | Tee-Object -FilePath provenance.txt -Append
          'BUILD FILE CANDIDATES' | Tee-Object -FilePath provenance.txt -Append
          Get-ChildItem src/lib/detours,src/lib/plutosvg -Recurse -File -Include *.sln,*.vcxproj,Makefile,makefile,CMakeLists.txt,*.cmake,README*,LICENSE* | ForEach-Object {
            $_.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1) | Tee-Object -FilePath provenance.txt -Append
          }
          Get-Content provenance.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lib-provenance-audit
          path: provenance.txt
          retention-days: 1
