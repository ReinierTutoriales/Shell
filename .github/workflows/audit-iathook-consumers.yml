name: Audit IAT hook consumers
on:
  push:
    paths: ['.github/workflows/audit-iathook-consumers.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Find IATHook consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== invoke() calls outside Hooker.h ==='
          grep -RInE '\.invoke[[:space:]]*\(' src --include='*.h' --include='*.cpp' | grep -v 'src/dll/src/Include/Hooker.h' || true
          echo '=== IATHook declarations/usages ==='
          grep -RIn 'IATHook' src --include='*.h' --include='*.cpp' || true
          echo '=== uninstall(true) / explicit clear ==='
          grep -RInE '\.uninstall[[:space:]]*\([[:space:]]*true' src --include='*.h' --include='*.cpp' || true
