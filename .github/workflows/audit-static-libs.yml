name: Audit static library references
on:
  push:
    paths: ['.github/workflows/audit-static-libs.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Inspect static library references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles=('detours-x86.lib','detours-x64.lib','detours-arm64.lib','plutosvg-x86.lib','plutosvg-x64.lib','plutosvg-arm64.lib','src/shared/Library','shared\\Library','shared/Library')
          exts={'.sln','.vcxproj','.vcxproj.filters','.props','.targets','.cpp','.c','.h','.hpp','.ps1','.cmd','.bat','.sh','.yml','.yaml','.xml','.md','.txt'}
          rows=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.as_posix()=='.github/workflows/audit-static-libs.yml':
              continue
            if p.suffix.lower() not in exts:
              continue
            try: lines=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
            except OSError: continue
            for i,line in enumerate(lines,1):
              lo=line.lower()
              if any(n.lower() in lo for n in needles):
                rows.append(f'{p}:{i}\t{line.strip()}')
          report='\n'.join(rows)+'\n'
          Path('static-libs-audit.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-libs-audit
          path: static-libs-audit.txt
          retention-days: 1
