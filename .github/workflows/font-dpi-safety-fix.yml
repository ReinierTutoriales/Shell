name: Menu font DPI safety cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/font-dpi-safety-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Harden menu font scaling
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/dll/src/ContextMenu.cpp')
          s=p.read_text(encoding='utf-8')
          s=s.replace('\nif(__font.name.is_string())\n', '\n\t\t\tif(__font.name.is_string())\n', 1)
          old='''\t\t\tif(font_size >= 6)\n\t\t\t{\n\t\t\t\t//font_size = dpi(font_size);\n\t\t\t\tif(font_size != _theme.font.lfHeight)\n\t\t\t\t{\n\t\t\t\t\tauto of = std::abs(_theme.font.lfHeight);\n\t\t\t\t\t//auto di = font_size - of;\n\t\t\t\t\t_theme.font.lfHeight = font_size;\n\t\t\t\t\tdpi.val = (font_size * dpi.val) / of;\n\t\t\t\t\t//MBF(L"%d, %d, %d", dpi.val, (font_size * dpi.val) / of, di);\n\t\t\t\t}\n\t\t\t}'''
          new='''\t\t\tif(font_size >= 6)\n\t\t\t{\n\t\t\t\t// Explicit NSS font size remains an override. Keep menu DPI owned by\n\t\t\t\t// the window/monitor instead of mutating it from a typography choice.\n\t\t\t\t_theme.font.lfHeight = -dpi.value<long>(font_size);\n\t\t\t}'''
          if s.count(old)!=1: raise SystemExit('font scaling block mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='')
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test "$(grep -F -c 'dpi.val = (font_size * dpi.val) / of;' src/dll/src/ContextMenu.cpp || true)" -eq 0
          grep -Fq '_theme.font.lfHeight = -dpi.value<long>(font_size);' src/dll/src/ContextMenu.cpp
          git config user.name ReinierTutoriales
          git config user.email 86568548+ReinierTutoriales@users.noreply.github.com
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: decouple menu font override from monitor DPI'
          git push
