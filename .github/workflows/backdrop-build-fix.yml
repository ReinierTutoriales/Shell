name: Backdrop build correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backdrop-build-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix documented backdrop build gate
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/dll/src/ContextMenu.cpp')
          s=p.read_text(encoding='utf-8')
          old='if(ver->build() >= 22621 && !_theme.isHighContrast && _theme.enableTransparency)'
          new='if(ver->Build >= 22621 && !_theme.isHighContrast && _theme.enableTransparency)'
          if s.count(old) != 1:
              raise SystemExit('backdrop version gate mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='')
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -Fq 'if(ver->Build >= 22621 && !_theme.isHighContrast && _theme.enableTransparency)' src/dll/src/ContextMenu.cpp
          test "$(grep -F -c 'ver->build()' src/dll/src/ContextMenu.cpp || true)" -eq 0
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: use Windows build field for backdrop gating'
          git push
