name: Modernize Theme System State

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Patch Theme.h and ContextMenu.cpp deterministically
        shell: python
        run: |
          from pathlib import Path

          theme = Path('src/dll/src/Include/Theme.h')
          text = theme.read_text(encoding='utf-8-sig')

          anchor = '''\t\t\tstruct gradientstop_t\n\t\t\t{\n\t\t\t\tdouble offset{};\n\t\t\t\tColor color;\n\t\t\t};\n'''
          insert = '''\t\t\tstruct gradientstop_t\n\t\t\t{\n\t\t\t\tdouble offset{};\n\t\t\t\tColor color;\n\t\t\t};\n\n\t\t\tstruct SystemState\n\t\t\t{\n\t\t\t\tbool highContrast{};\n\t\t\t\tbool transparency{};\n\t\t\t\tbool systemUsesLightTheme = true;\n\t\t\t\tbool appsUseLightTheme = true;\n\n\t\t\t\tstatic SystemState Capture()\n\t\t\t\t{\n\t\t\t\t\tSystemState state;\n\t\t\t\t\tstate.highContrast = Theme::IsHighContrast();\n\t\t\t\t\tif(!state.highContrast)\n\t\t\t\t\t{\n\t\t\t\t\t\tTheme::Personalize(&state.systemUsesLightTheme,\n\t\t\t\t\t\t\t\t\t\t &state.appsUseLightTheme,\n\t\t\t\t\t\t\t\t\t\t &state.transparency);\n\t\t\t\t\t}\n\t\t\t\t\treturn state;\n\t\t\t\t}\n\t\t\t};\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Theme anchor count={text.count(anchor)}')
          text = text.replace(anchor, insert, 1)
          theme.write_text(text, encoding='utf-8')

          cm = Path('src/dll/src/ContextMenu.cpp')
          text = cm.read_text(encoding='utf-8-sig')
          old = '''\t\t\tauto isHighContrast = Theme::IsHighContrast();\n\n\t\t\tObject obj;\n'''
          new = '''\t\t\tconst auto systemState = Theme::SystemState::Capture();\n\t\t\tconst bool isHighContrast = systemState.highContrast;\n\n\t\t\tObject obj;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Context state anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''\t\t\tbool enableTransparency = false;\n\t\t\tbool systemUsesLightTheme = true;\n\t\t\tbool appsUseLightTheme = true;\n\n\t\t\tif(isHighContrast)\n\t\t\t\t_theme.system.mode = 2;\n\t\t\telse\n\t\t\t{\n\t\t\t\tTheme::Personalize(&systemUsesLightTheme, &appsUseLightTheme, &enableTransparency);\n\t\t\t\t_theme.system.mode = isHighContrast ? 2 : (systemUsesLightTheme ? 0 : 1);\n\t\t\t}\n'''
          new = '''\t\t\tbool enableTransparency = systemState.transparency;\n\t\t\tbool systemUsesLightTheme = systemState.systemUsesLightTheme;\n\t\t\tbool appsUseLightTheme = systemState.appsUseLightTheme;\n\n\t\t\t_theme.system.mode = isHighContrast ? 2 : (systemUsesLightTheme ? 0 : 1);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Context personalize block count={text.count(old)}')
          text = text.replace(old, new, 1)

          duplicate = '''\t\t\t_theme.enableTransparency = enableTransparency;\n\t\t\t_theme.systemUsesLightTheme = systemUsesLightTheme;\n\t\t\t_theme.appsUseLightTheme = appsUseLightTheme;\n\t\t\t_theme.isHighContrast = isHighContrast;\n'''
          if text.count(duplicate) != 2:
              raise SystemExit(f'Context duplicate state writes count={text.count(duplicate)}')
          text = text.replace(duplicate, '', 1)
          cm.write_text(text, encoding='utf-8')

      - name: Show focused diff
        run: git diff --check && git diff -- src/dll/src/Include/Theme.h src/dll/src/ContextMenu.cpp
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dll/src/Include/Theme.h src/dll/src/ContextMenu.cpp
          git commit -m "refactor(theme): capture Windows visual state once"
          git push origin HEAD:main
