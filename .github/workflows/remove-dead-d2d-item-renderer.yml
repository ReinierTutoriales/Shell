name: Remove dead D2D item renderer
on:
  push:
    paths:
      - '.github/workflows/remove-dead-d2d-item-renderer.yml'
permissions:
  contents: write
concurrency:
  group: remove-dead-d2d-item-renderer
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove unreachable item renderer only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path('src/dll/src/ContextMenu.cpp')
          h = Path('src/dll/src/Include/ContextMenu.h')
          s = cpp.read_text(encoding='utf-8')
          start_token = '\t\tLRESULT ContextMenu::OnDrawItem_D2D(DRAWITEMSTRUCT *di)\n\t\t{'
          end_token = '\n\t\tint ooo = 0;\n\n\t\tLRESULT ContextMenu::OnDrawItem(DRAWITEMSTRUCT *di)'
          if s.count(start_token) != 1 or s.count(end_token) != 1:
              raise SystemExit('unexpected D2D renderer boundaries')
          a = s.index(start_token)
          b = s.index(end_token, a)
          s = s[:a] + '\t\tLRESULT ContextMenu::OnDrawItem(DRAWITEMSTRUCT *di)' + s[b + len(end_token):]
          dead_switch = '\n\t\t\tbool render_d2d = false;\n\t\t\tif(render_d2d)\n\t\t\t\treturn OnDrawItem_D2D(di);\n'
          if s.count(dead_switch) != 1:
              raise SystemExit(f'unexpected render_d2d switch count: {s.count(dead_switch)}')
          s = s.replace(dead_switch, '\n', 1)
          cpp.write_text(s, encoding='utf-8', newline='')

          hs = h.read_text(encoding='utf-8')
          decl = '\n\t\t\tLRESULT OnDrawItem_D2D(DRAWITEMSTRUCT *di);\n'
          if hs.count(decl) != 1:
              raise SystemExit(f'unexpected declaration count: {hs.count(decl)}')
          h.write_text(hs.replace(decl, '\n', 1), encoding='utf-8', newline='')
          PY
          ! grep -RIn --exclude-dir=.git --exclude='remove-dead-d2d-item-renderer.yml' -E 'OnDrawItem_D2D|render_d2d' src
          grep -q 'D2D d2d;' src/dll/src/Include/ContextMenu.h
          grep -q 'D2D d2d;' src/dll/src/ContextMenu.cpp
          git diff --check
      - name: Commit production cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp src/dll/src/Include/ContextMenu.h
          git commit -m 'refactor: remove unreachable D2D item renderer'
          git push origin HEAD:main
