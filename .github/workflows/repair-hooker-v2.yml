name: Repair Hooker header v2
on:
  push:
    paths: ['.github/workflows/repair-hooker-v2.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore known-good header and remove dead invoke
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git show 17e099cff2e69d875c73756614279e75f29fc6e6:src/dll/src/Include/Hooker.h > /tmp/Hooker.good
          test "$(wc -l < /tmp/Hooker.good)" -gt 300
          cp /tmp/Hooker.good src/dll/src/Include/Hooker.h
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dll/src/Include/Hooker.h')
          s=p.read_text(encoding='utf-8-sig')
          start=s.index('\n\t\ttemplate <typename T, typename... Args>\n\t\tauto invoke(Args&&... args)')
          end=s.index('\n\t\tbool commit(', start)
          chunk=s[start:end]
          if 'reinterpret_cast<T *>(_orignal)(args...)' not in chunk:
              raise SystemExit('unexpected invoke block')
          s=s[:start]+'\n'+s[end:]
          p.write_text(s,encoding='utf-8',newline='')
          PY
          test "$(wc -l < src/dll/src/Include/Hooker.h)" -gt 300
          grep -q 'struct IATHook' src/dll/src/Include/Hooker.h
          grep -q 'bool commit(' src/dll/src/Include/Hooker.h
          ! grep -q 'auto invoke(Args&&... args)' src/dll/src/Include/Hooker.h
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dll/src/Include/Hooker.h
          git commit -m 'fix: restore Hooker header and remove dead invoke'
          git pull --rebase origin main
          git push origin HEAD:main
