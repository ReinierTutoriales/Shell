name: Audit hash tool references
on:
  push:
    paths: ['.github/workflows/audit-hash-tool.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Inspect hash tool
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rows=[]
          for p in Path('src/tools/hash').rglob('*'):
            if p.is_file():
              rows.append(f'FILE\t{p}\t{p.stat().st_size}')
          rows.append('')
          rows.append('REFERENCES')
          needles=('src/tools/hash','tools/hash','hash.exe','hash\\publish','hash/publish')
          text_exts={'.sln','.vcxproj','.vcxproj.filters','.csproj','.props','.targets','.ps1','.cmd','.bat','.sh','.yml','.yaml','.xml','.iss','.wxs','.wxi','.md','.txt','.cpp','.h','.hpp','.c'}
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.as_posix()=='.github/workflows/audit-hash-tool.yml': continue
            if p.suffix.lower() not in text_exts: continue
            try: lines=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
            except OSError: continue
            for i,line in enumerate(lines,1):
              lo=line.lower()
              if any(n.lower() in lo for n in needles):
                rows.append(f'{p}:{i}\t{line.strip()}')
          report='\n'.join(rows)+'\n'
          Path('hash-tool-audit.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hash-tool-audit
          path: hash-tool-audit.txt
          retention-days: 1
