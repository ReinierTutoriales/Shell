name: Fix Detours state
on:
  push:
    paths: ['.github/workflows/fix-detour-state.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Make Detours state transactional
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/shared/Library/detours.h')
          s=p.read_text(encoding='utf-8-sig')
          old='''\tDetours &hook()\n\t{\n\t\tif(!_installed)\n\t\t{\n\t\t\tDetourAttach(&_original, _detour);\n\t\t\t_installed = true;\n\t\t}\n\t\treturn *this;\n\t}\n\n\tDetours &unhook()\n\t{\n\t\tif(_installed)\n\t\t{\n\t\t\tDetourDetach(&_original, _detour);\n\t\t\t_installed = false;\n\t\t}\n\t\treturn *this;\n\t}\n'''
          new='''\tDetours &hook()\n\t{\n\t\tif(!_installed && _original && _detour)\n\t\t{\n\t\t\tif(NO_ERROR == DetourAttach(&_original, _detour))\n\t\t\t\t_installed = true;\n\t\t}\n\t\treturn *this;\n\t}\n\n\tDetours &unhook()\n\t{\n\t\tif(_installed && _original && _detour)\n\t\t{\n\t\t\tif(NO_ERROR == DetourDetach(&_original, _detour))\n\t\t\t\t_installed = false;\n\t\t}\n\t\treturn *this;\n\t}\n'''
          if s.count(old)!=1: raise SystemExit(f'block count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='')
          PY
          git diff --check
          git diff -- src/shared/Library/detours.h
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shared/Library/detours.h
          git commit -m 'fix: keep Detours state consistent with API results'
          git pull --rebase origin main
          git push origin HEAD:main
