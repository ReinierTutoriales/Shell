name: Audit delay thunk consumer
on:
  push:
    paths: ['.github/workflows/audit-delay-thunk.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify get_delay_thunk reachability
        shell: bash
        run: |
          set -euo pipefail
          echo '=== exact get_delay_thunk occurrences ==='
          grep -RIn --exclude-dir=.git --exclude='audit-delay-thunk.yml' -F 'get_delay_thunk' . || true
          echo '=== delay import descriptor occurrences ==='
          grep -RIn --exclude-dir=.git --exclude='audit-delay-thunk.yml' -E 'IMAGE_DELAYLOAD_DESCRIPTOR|DELAY_IMPORT|DelayImport' src || true
