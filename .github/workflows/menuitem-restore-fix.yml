name: Restore menu item header safely
on:
  push:
    branches: [main]
    paths: ['.github/workflows/menuitem-restore-fix.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 20
      - name: Restore full header and remove only undefined accessor
        shell: bash
        run: |
          git checkout 61f2cc1634b6b812322d463eb3e7a81e51d1a38b -- src/dll/src/Include/MenuItem.h
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/dll/src/Include/MenuItem.h')
          s=p.read_text(encoding='utf-8')
          s2,n=re.subn(r'\n\s*HBITMAP\s+get_image\s*\(\s*\)\s*\{\s*\}\s*', '\n', s, count=1)
          if n != 1:
              raise SystemExit(f'get_image count={n}')
          p.write_text(s2, encoding='utf-8', newline='')
          PY
          git diff --check
          test "$(grep -F -c 'HBITMAP get_image' src/dll/src/Include/MenuItem.h || true)" -eq 0
          grep -Fq 'parse_parent' src/dll/src/Include/MenuItem.h
          grep -Fq 'struct MUID' src/dll/src/Include/MenuItem.h
          grep -Fq 'hashing' src/dll/src/Include/MenuItem.h
          git config user.name ReinierTutoriales
          git config user.email 86568548+ReinierTutoriales@users.noreply.github.com
          git add src/dll/src/Include/MenuItem.h
          git commit -m 'fix: restore menu item header and remove undefined accessor'
          git push
