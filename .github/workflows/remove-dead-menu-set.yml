name: Remove dead menu setter
on:
  push:
    paths:
      - '.github/workflows/remove-dead-menu-set.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove unconsumed misleading setter
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/dll/src/Include/MenuItem.h')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\tbool set(HMENU hMenu, int item, bool byPosition = true)\n\t\t\t{\n\t\t\t\tif(!title.text.empty())\n\t\t\t\t{\n\t\t\t\t\tdwTypeData = title.text;\n\t\t\t\t\tcch = title.text.length<uint32_t>();\n\t\t\t\t}\n\n\t\t\t\treturn ::GetMenuItemInfoW(hMenu, item, byPosition, this);\n\t\t\t}\n\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one dead setter, found {s.count(old)}')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8', newline='')
      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'bool set(HMENU hMenu' src/dll/src/Include/MenuItem.h
          grep -n 'bool get(HMENU hMenu' src/dll/src/Include/MenuItem.h
          grep -n 'HBITMAP get_image()' src/dll/src/Include/MenuItem.h
          git diff --check
      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add src/dll/src/Include/MenuItem.h
          git commit -m 'refactor: remove dead misleading menu setter'
          git push origin HEAD:main
