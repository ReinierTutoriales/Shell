name: Theme state and font cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-state-font-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Consolidate system theme state and font acquisition
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/dll/src/ContextMenu.cpp')
          text = path.read_text(encoding='utf-8')

          mode_pattern = r'(?m)^(\s*)_theme\.system\.mode = systemUsesLightTheme \? 0 : 1;$'
          text, n = re.subn(mode_pattern, r'\1_theme.system.mode = isHighContrast ? 2 : (systemUsesLightTheme ? 0 : 1);', text, count=1)
          if n != 1:
              raise SystemExit('early system mode assignment mismatch')

          fallback_pattern = r'(?m)^(\s*)_theme\.font\.lfHeight = 12;dpi\.valuexx<long>\(12\);$'
          text, n = re.subn(fallback_pattern, r'\1_theme.font.lfHeight = dpi.valuexx<long>(12);', text, count=1)
          if n != 1:
              raise SystemExit('font fallback mismatch')

          scale_pattern = re.compile(
              r'\n\s*if\(ver->IsWindows11OrGreater\(\)\)\s*\{\s*'
              r'DWORD dwTextScaleFactor = 100, cbData;\s*'
              r'::RegGetValueW\(HKEY_CURRENT_USER, L"Software\\\\Microsoft\\\\Accessibility",\s*'
              r'L"TextScaleFactor", RRF_RT_DWORD, nullptr, &dwTextScaleFactor, &cbData\);\s*'
              r'long scale = \(\(dpi\.val \+ 24\) \* dwTextScaleFactor\) / 100;\s*'
              r'_theme\.font\.lfHeight = 12 \* scale / 100;\s*'
              r'\}\s*', re.MULTILINE)
          text, n = scale_pattern.subn('\n', text, count=1)
          if n != 1:
              raise SystemExit('Windows 11 TextScaleFactor override mismatch')

          path.write_text(text, encoding='utf-8', newline='')

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          ! grep -q 'TextScaleFactor' src/dll/src/ContextMenu.cpp
          ! grep -q 'lfHeight = 12;dpi.valuexx' src/dll/src/ContextMenu.cpp
          count=$(grep -F -c '_theme.system.mode = isHighContrast ? 2 : (systemUsesLightTheme ? 0 : 1);' src/dll/src/ContextMenu.cpp)
          test "$count" -eq 2
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'fix: honor Windows menu font and high contrast state'
          git push
