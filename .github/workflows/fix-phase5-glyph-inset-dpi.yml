name: Glyph inset DPI correction
on:
  push:
    paths:
      - '.github/workflows/fix-phase5-glyph-inset-dpi.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scale glyph-only horizontal inset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/dll/src/ContextMenu.cpp')
          s = p.read_text(encoding='utf-8')
          old = "\t\t\t\t\t\t\trcimg = *rc;\n\t\t\t\t\t\t\trcimg.left += 3;\n\t\t\t\t\t\t\trcimg.right -= 3;"
          new = "\t\t\t\t\t\t\trcimg = *rc;\n\t\t\t\t\t\t\t// Match the DPI-aware three-pixel baseline used by the\n\t\t\t\t\t\t\t// surrounding icon-only menu block.\n\t\t\t\t\t\t\trcimg.left += dpi(3);\n\t\t\t\t\t\t\trcimg.right -= dpi(3);"
          if s.count(old) != 1:
              raise SystemExit(f'expected one unscaled glyph inset block, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='')
          PY
          test "$(grep -c 'rcimg.left += 3;' src/dll/src/ContextMenu.cpp || true)" -eq 0
          test "$(grep -c 'rcimg.right -= 3;' src/dll/src/ContextMenu.cpp || true)" -eq 0
          test "$(grep -c 'rcimg.left += dpi(3);' src/dll/src/ContextMenu.cpp)" -eq 1
          test "$(grep -c 'rcimg.right -= dpi(3);' src/dll/src/ContextMenu.cpp)" -eq 1
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: scale icon-only glyph inset with DPI'
          git push origin HEAD:main
