name: Harden IAT hook
on:
  push:
    paths: ['.github/workflows/harden-iat-hook.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Harden IAT state transitions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dll/src/Include/Hooker.h')
          s=p.read_text(encoding='utf-8-sig')
          old='''\t\tbool installed() const\n\t\t{\n\t\t\treturn _thunk &&_thunk->u1.Function == _detour;\n\t\t}\n'''
          new='''\t\tbool installed() const\n\t\t{\n\t\t\tif(!_thunk || !_detour)\n\t\t\t\treturn false;\n\t\t\t__try\n\t\t\t{\n\t\t\t\treturn _thunk->u1.Function == _detour;\n\t\t\t}\n\t\t\texcept { return false; }\n\t\t}\n'''
          if s.count(old)!=1: raise SystemExit(f'installed block count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''\t\t\t\tDWORD protect;\n\t\t\t\tif(::VirtualProtect(&_thunk->u1.Function, sizeof(uintptr_t), PAGE_EXECUTE_READWRITE, &protect))\n\t\t\t\t{\n\t\t\t\t\t_thunk->u1.Function = lpfunc;\n\t\t\t\t\tif(::VirtualProtect(&_thunk->u1.Function, sizeof(uintptr_t), protect, &protect))\n\t\t\t\t\t{\n\t\t\t\t\t\tif(flush)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t//https://devblogs.microsoft.com/oldnewthing/20190902-00/?p=102828\n\t\t\t\t\t\t\t::FlushInstructionCache(::GetCurrentProcess(), &_thunk->u1.Function, sizeof(ULONG_PTR));\n\t\t\t\t\t\t}\n\t\t\t\t\t\treturn true;\n\t\t\t\t\t}\n\t\t\t\t}\n'''
          new='''\t\t\t\tDWORD protect{};\n\t\t\t\tif(::VirtualProtect(&_thunk->u1.Function, sizeof(uintptr_t), PAGE_READWRITE, &protect))\n\t\t\t\t{\n\t\t\t\t\t_thunk->u1.Function = lpfunc;\n\n\t\t\t\t\tDWORD ignored{};\n\t\t\t\t\tconst auto restored = ::VirtualProtect(&_thunk->u1.Function, sizeof(uintptr_t), protect, &ignored);\n\t\t\t\t\tif(flush)\n\t\t\t\t\t\t::FlushInstructionCache(::GetCurrentProcess(), &_thunk->u1.Function, sizeof(uintptr_t));\n\t\t\t\t\treturn restored != FALSE;\n\t\t\t\t}\n'''
          if s.count(old)!=1: raise SystemExit(f'commit block count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='')
          PY
          git diff --check
          git diff -- src/dll/src/Include/Hooker.h
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dll/src/Include/Hooker.h
          git commit -m 'fix: harden IAT hook memory transitions'
          git pull --rebase origin main
          git push origin HEAD:main
