name: Wire D2D begin fallback
on:
  push:
    paths:
      - '.github/workflows/wire-d2d-begin-fallback.yml'
permissions:
  contents: read
concurrency:
  group: wire-d2d-begin-fallback
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enumerate actual begin calls and erase background block
        shell: bash
        run: |
          set -euo pipefail
          echo '=== begin calls ==='
          grep -RIn --exclude-dir=.git -E '\.begin[[:space:]]*\(' src/dll/src || true
          echo '=== WM_ERASEBKGND ==='
          grep -RIn --exclude-dir=.git 'WM_ERASEBKGND' src/dll/src || true
          echo '=== D2D declarations ==='
          grep -RIn --exclude-dir=.git -E '\bD2D[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' src/dll/src || true
