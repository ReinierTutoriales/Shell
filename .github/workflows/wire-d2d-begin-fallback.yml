name: Wire D2D begin fallback
on:
  push:
    paths:
      - '.github/workflows/wire-d2d-begin-fallback.yml'
permissions:
  contents: write
concurrency:
  group: wire-d2d-begin-fallback
  cancel-in-progress: true
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Guard the real D2D consumer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dll/src/ContextMenu.cpp')
          s=p.read_text(encoding='utf-8')
          old='d2d.begin(wnd->hdc, { 0, 0, r.width(), r.height() });'
          new='''if(!d2d.begin(wnd->hdc, { 0, 0, r.width(), r.height() }))\n\t\t\t\t\t\t\treturn wnd->msg.invoke();'''
          if new in s:
              print('already applied')
          elif s.count(old)==1:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8',newline='')
          else:
              raise SystemExit(f'unexpected consumer count: {s.count(old)}')
          PY
          grep -q 'if(!d2d.begin(wnd->hdc' src/dll/src/ContextMenu.cpp
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: fall back when D2D menu background cannot bind'
          git pull --rebase origin main
          git push origin HEAD:main
