name: Audit Explorer restart
on:
  push:
    paths:
      - '.github/workflows/audit-explorer-restart.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find restart consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== declarations/calls ==='
          grep -RIn --exclude-dir=.git -E '\bRestart0\s*\(|\bRestart1\s*\(|\bRestart2\s*\(|\bRestart\s*\(' src | head -n 300 || true
          echo '=== process terminate consumers ==='
          grep -RIn --exclude-dir=.git -E 'TerminateProcess\(|PROCESS_TERMINATE' src --exclude='detours.cpp' | head -n 300 || true
