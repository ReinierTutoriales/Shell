name: Audit dynamic library loads
on:
  push:
    paths: ['.github/workflows/audit-dynamic-loads.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan dynamic loads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          exts={'.h','.hpp','.c','.cc','.cpp','.cxx'}
          terms=('LoadLibraryW(','LoadLibraryExW(','LoadLibraryA(','LoadLibraryExA(','DLL(')
          rows=[]
          for p in Path('src').rglob('*'):
            if p.suffix.lower() not in exts: continue
            try: lines=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
            except OSError: continue
            for i,line in enumerate(lines,1):
              if any(t in line for t in terms):
                rows.append(f'{p}:{i}\t{line.strip()}')
          report='\n'.join(rows)+'\n'
          Path('dynamic-loads-audit.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-loads-audit
          path: dynamic-loads-audit.txt
          retention-days: 1
