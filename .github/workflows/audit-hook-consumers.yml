name: Audit hook consumers
on:
  push:
    paths:
      - '.github/workflows/audit-hook-consumers.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== WindowsHook consumers ==='
          grep -RIn --exclude-dir=.git -E '\bWindowsHook\b|\.callnext\(|\.hook\([^;]*(WH_|HookProc)' src || true
          echo '=== WinEventHook consumers ==='
          grep -RIn --exclude-dir=.git -E '\bWinEventHook\b' src || true
          echo '=== WindowSubclass consumers ==='
          grep -RIn --exclude-dir=.git -E '\bWindowSubclass\b' src || true
          echo '=== Hooker.h references ==='
          grep -RIn --exclude-dir=.git -E '#include.*Hooker\.h' src || true
          echo '=== suspicious remote-process primitives ==='
          grep -RIn --exclude-dir=.git -E 'CreateRemoteThread|WriteProcessMemory|VirtualAllocEx|OpenProcess\(|QueueUserAPC|NtWriteVirtualMemory|SetThreadContext' src || true
