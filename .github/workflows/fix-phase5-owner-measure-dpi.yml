name: Owner measure DPI correction
on:
  push:
    paths:
      - '.github/workflows/fix-phase5-owner-measure-dpi.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scale owner-measured sentinel geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/dll/src/ContextMenu.cpp')
          s = p.read_text(encoding='utf-8')
          old = "\t\t\tif(mi->itemID == 0x5ffffffe)\n\t\t\t{\n\t\t\t\tmi->itemWidth = 260;\n\t\t\t\tmi->itemHeight = 50;\n\t\t\t}"
          new = "\t\t\tif(mi->itemID == 0x5ffffffe)\n\t\t\t{\n\t\t\t\t// This owner-measured sentinel participates in the same device-pixel\n\t\t\t\t// layout as the rest of the popup; keep its 96-DPI baseline scalable.\n\t\t\t\tmi->itemWidth = dpi(260u);\n\t\t\t\tmi->itemHeight = dpi(50u);\n\t\t\t}"
          if s.count(old) != 1:
              raise SystemExit(f'expected one fixed sentinel measure block, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='')
          PY
          test "$(grep -c 'itemWidth = 260;' src/dll/src/ContextMenu.cpp || true)" -eq 0
          test "$(grep -c 'itemHeight = 50;' src/dll/src/ContextMenu.cpp || true)" -eq 0
          test "$(grep -c 'itemWidth = dpi(260u);' src/dll/src/ContextMenu.cpp)" -eq 1
          test "$(grep -c 'itemHeight = dpi(50u);' src/dll/src/ContextMenu.cpp)" -eq 1
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: scale owner-measured sentinel with DPI'
          git push origin HEAD:main
