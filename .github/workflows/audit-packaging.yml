name: Audit packaging consumers
on:
  push:
    paths: ['.github/workflows/audit-packaging.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit package and download references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Chocolatey/package references outside packages/choco ==='
          grep -RInE 'packages/choco|nilesoft-shell\.nuspec|choco(pack|latey)|setup\.exe|nilesoft\.org/download' . --exclude-dir=.git --exclude-dir=packages || true
          echo '=== Network/download primitives in build and scripts ==='
          grep -RInE 'Invoke-WebRequest|Invoke-RestMethod|Start-BitsTransfer|curl([ .]|$)|wget([ .]|$)|DownloadFile|WebClient|URLDownload|WinHttp|WinInet|InternetOpen' .github src packages --exclude-dir=.git || true
          echo '=== packages.config ==='
          find src -name packages.config -print -exec cat {} \;
