name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        configuration: [release]
        platform: [x64, x86, arm64]
      fail-fast: false

    env:
      SOLUTION_FILE_PATH: src/Shell.sln
      BUILD_CONFIGURATION: ${{matrix.configuration}}
      BUILD_PLATFORM: ${{matrix.platform}}
      BIN_PATH: D:\a\Shell\Shell\src\bin
    # Shell currently targets the VS2022 v143 platform toolset. Pinning the
    # runner prevents windows-latest from silently moving the build to a VS2026
    # image that does not contain v143, especially for ARM64.
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      with:
        vs-version: '[17.0,18.0)'

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}} -NonInteractive

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /restore /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{env.BUILD_PLATFORM}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: shell-${{matrix.platform}}
        path: |
          ${{env.BIN_PATH}}\*
          !${{env.BIN_PATH}}\*.lib
          !${{env.BIN_PATH}}\*.exp
          !${{env.BIN_PATH}}\*.wixpdb
          !${{env.BIN_PATH}}\ca.dll
        if-no-files-found: warn
        retention-days: 0
        compression-level: 6
        overwrite: false
        include-hidden-files: false
