name: Audit Shell runtime
on:
  push:
    paths:
      - '.github/workflows/audit-shell-runtime.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Backdrop expression provenance
        shell: bash
        run: |
          set -euo pipefail
          echo '=== background.effect definitions/usages ==='
          grep -RIn --exclude-dir=.git -E 'background\.effect|effectOverridden|struct .*background|auto_expr.*effect|effect.*auto_expr' src | head -n 250 || true
          echo '=== settings theme structures ==='
          grep -RIn --exclude-dir=.git -E 'struct (BACKGROUND|THEME|Theme)|class Settings|BACKGROUND' src/dll/src | head -n 250 || true
      - name: Command execution surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ShellExec ==='
          grep -RIn --exclude-dir=.git -E 'ShellExec|ShellExecuteEx|ShellExecuteW|CreateProcessW|CreateProcessAsUser|WinExec' src | head -n 300 || true
          echo '=== dynamic loading / network / registry / hooks ==='
          grep -RIn --exclude-dir=.git -E 'LoadLibrary|GetProcAddress|URLDownload|WinHttp|WinInet|InternetOpen|RegSetValue|RegCreateKey|SetWindowsHook|SetWindowSubclass|CreateRemoteThread|WriteProcessMemory' src | head -n 400 || true
