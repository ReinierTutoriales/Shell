name: Harden bitmap resource load
on:
  push:
    paths: ['.github/workflows/harden-bitmap-resource-load.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Load bitmap modules as resources only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/shared/System/Drawing/Image.h')
          s=p.read_text(encoding='utf-8-sig')
          old='''\t\t\t\t\tif(resId >= 0)\n\t\t\t\t\t{\n\t\t\t\t\t\th = ::LoadLibraryW(path);\n\t\t\t\t\t\tfuLoad = 0;\n\t\t\t\t\t\tpath = nullptr;\n\t\t\t\t\t}\n'''
          new='''\t\t\t\t\tif(resId >= 0)\n\t\t\t\t\t{\n\t\t\t\t\t\th = ::LoadLibraryExW(path, nullptr, LOAD_LIBRARY_AS_DATAFILE | LOAD_LIBRARY_AS_IMAGE_RESOURCE);\n\t\t\t\t\t\tfuLoad = 0;\n\t\t\t\t\t\tpath = nullptr;\n\t\t\t\t\t}\n'''
          if s.count(old)!=1: raise SystemExit(f'bitmap resource block count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='')
          PY
          git diff --check
          git diff -- src/shared/System/Drawing/Image.h
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shared/System/Drawing/Image.h
          git commit -m 'security: load bitmap modules as resources only'
          git pull --rebase origin main
          git push origin HEAD:main
