name: Audit binary artifacts
on:
  push:
    paths: ['.github/workflows/audit-binary-artifacts.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Inventory binary and archive artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          exts={'.exe','.dll','.sys','.msi','.nupkg','.zip','.7z','.cab','.bin','.dat','.pdb','.lib','.exp','.obj','.ilk'}
          rows=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts:
              continue
            if p.suffix.lower() in exts:
              rows.append(f'{p}\t{p.stat().st_size}')
          report='\n'.join(rows)+'\n'
          Path('binary-artifacts-audit.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-artifacts-audit
          path: binary-artifacts-audit.txt
          retention-days: 1
