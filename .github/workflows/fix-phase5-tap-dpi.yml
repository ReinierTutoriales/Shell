name: Menu tap DPI correction
on:
  push:
    paths:
      - '.github/workflows/fix-phase5-tap-dpi.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove duplicate tap DPI scaling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/dll/src/ContextMenu.cpp')
          s = p.read_text(encoding='utf-8')
          old = '\t\t\t_theme.text.tap = dpi.value<int8_t>(_theme.text.tap);\n\n\t\t\tlong font_size = -1;'
          new = '\t\t\t// Theme::scale() owns DPI conversion for text.tap. Scaling here as well\n\t\t\t// made the tap target grow twice on monitors above 100% DPI.\n\t\t\tlong font_size = -1;'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one pre-scale tap conversion, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='')
          PY
          test "$(grep -c '_theme.text.tap = dpi.value<int8_t>(_theme.text.tap);' src/dll/src/ContextMenu.cpp || true)" -eq 0
          test "$(grep -c 'text.tap = dpi->value<int8_t>(text.tap);' src/dll/src/Include/Theme.h)" -eq 1
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'fix: scale menu tap target once per DPI'
          git push origin HEAD:main
