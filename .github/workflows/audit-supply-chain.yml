name: Audit supply-chain download surfaces
on:
  push:
    paths: ['.github/workflows/audit-supply-chain.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Scan download and packaged-binary surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text_exts={'.h','.hpp','.c','.cc','.cpp','.cxx','.ps1','.cmd','.bat','.sh','.yml','.yaml','.xml','.nuspec','.config','.props','.targets','.iss','.wxs','.wxi','.md','.txt'}
          needles=('http://','https://','Invoke-WebRequest','Invoke-RestMethod','Start-BitsTransfer','WebClient','DownloadFile','URLDownloadToFile','WinHttp','WinInet','InternetOpen','curl ','wget ','bitsadmin','certutil -urlcache','setup.exe','msiexec','choco install','nuget install')
          rows=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            if p.suffix.lower() not in text_exts: continue
            try: lines=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
            except OSError: continue
            for i,line in enumerate(lines,1):
              if any(n.lower() in line.lower() for n in needles):
                rows.append(f'{p}:{i}\t{line.strip()}')
          binary_exts={'.exe','.dll','.sys','.msi','.nupkg','.zip','.7z','.cab','.bin','.dat'}
          bins=[]
          for p in Path('.').rglob('*'):
            if p.is_file() and '.git' not in p.parts and p.suffix.lower() in binary_exts:
              try: size=p.stat().st_size
              except OSError: size=-1
              bins.append(f'{p}\t{size}')
          report='TEXT MATCHES\n'+'\n'.join(rows)+'\n\nBINARY/PACKAGE FILES\n'+'\n'.join(bins)+'\n'
          Path('supply-chain-audit.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-audit
          path: supply-chain-audit.txt
          retention-days: 1
