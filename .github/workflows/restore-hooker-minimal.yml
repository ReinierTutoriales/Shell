name: Restore Hooker minimal
on:
  push:
    paths: ['.github/workflows/restore-hooker-minimal.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore
        shell: bash
        run: |
          set -euxo pipefail
          git show 17e099cff2e69d875c73756614279e75f29fc6e6:src/dll/src/Include/Hooker.h > src/dll/src/Include/Hooker.h
          git diff -- src/dll/src/Include/Hooker.h
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dll/src/Include/Hooker.h
          git commit -m 'fix: restore truncated Hooker header'
          git push origin HEAD:main
