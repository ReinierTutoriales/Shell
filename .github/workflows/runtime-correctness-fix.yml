name: Apply runtime correctness fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-correctness-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label):
              out, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return out

          p = Path('src/dll/src/ContextMenu.cpp')
          s = p.read_text(encoding='utf-8-sig')

          s = sub1(s,
              r'(?m)^(\s*)composition\.activated = ::IsCompositionActive\(\);\s*\n\s*::DwmIsCompositionEnabled\(reinterpret_cast<BOOL \*>\(&composition\.DwmEnabled\)\);',
              r'\1composition.activated = ::IsCompositionActive();\n\1BOOL dwmEnabled = FALSE;\n\1composition.DwmEnabled = SUCCEEDED(::DwmIsCompositionEnabled(&dwmEnabled)) && dwmEnabled != FALSE;',
              'DWM BOOL safety')

          s = sub1(s,
              r'(?m)^\s*font\.menu\.lfHeight = dpi\(font\.menu\.lfHeight\);\s*\n',
              '',
              'DPI-aware menu font')

          s = sub1(s,
              r'(?m)^(\s*)_theme\.system\.mode = systemUsesLightTheme \? 0 : 1;\s*\n(\s*)_theme\.isHighContrast = isHighContrast;\s*\n(\s*)_theme\.appsUseLightTheme = appsUseLightTheme;',
              r'\1_theme.system.mode = isHighContrast ? 2 : (systemUsesLightTheme ? 0 : 1);\n\2_theme.isHighContrast = isHighContrast;\n\3_theme.appsUseLightTheme = appsUseLightTheme;',
              'high contrast metadata')

          s = sub1(s,
              r'(?m)^(\s*)eval_state\(&th->symbol\.chevron, &_theme\.symbols\.chevron\);\s*\n\s*eval_state\(&th->symbol\.bullet, &_theme\.symbols\.chevron\);\s*\n\s*eval_state\(&th->symbol\.checkmark, &_theme\.symbols\.chevron\);',
              r'\1eval_state(&th->symbol.chevron, &_theme.symbols.chevron);\n\1eval_state(&th->symbol.bullet, &_theme.symbols.bullet);\n\1eval_state(&th->symbol.checkmark, &_theme.symbols.checked);',
              'symbol routing')

          s = sub1(s,
              r'(?m)^(\s*)BOOL ENABLED = TRUE;\s*\n\s*::DwmSetWindowAttribute\(hWnd, DWMWA_NCRENDERING_ENABLED, &ENABLED, sizeof\(BOOL\)\);\s*\n\s*::DwmSetWindowAttribute\(hWnd, DWMWA_ALLOW_NCPAINT, &ENABLED, sizeof\(BOOL\)\);\s*\n\s*::DwmSetWindowAttribute\(hWnd, DWMWA_NONCLIENT_RTL_LAYOUT, &ENABLED, sizeof\(BOOL\)\);',
              r'\1BOOL enabled = TRUE;\n\1BOOL rtl = is_layoutRTL ? TRUE : FALSE;\n\1::DwmSetWindowAttribute(hWnd, DWMWA_NCRENDERING_ENABLED, &enabled, sizeof(enabled));\n\1::DwmSetWindowAttribute(hWnd, DWMWA_ALLOW_NCPAINT, &enabled, sizeof(enabled));\n\1::DwmSetWindowAttribute(hWnd, DWMWA_NONCLIENT_RTL_LAYOUT, &rtl, sizeof(rtl));',
              'RTL DWM state')

          p.write_text(s, encoding='utf-8-sig', newline='')

          p = Path('src/dll/src/Include/Theme.h')
          s = p.read_text(encoding='utf-8-sig')

          # Keep Personalize behavior intact while making all outputs deterministic.
          s = sub1(s,
              r'(?m)^(\s*static void Personalize\([^\n]+\)\s*\n\s*\{)',
              r'\1\n\t\t\tif(lpEnableTransparency) *lpEnableTransparency = false;\n\t\t\tif(lpSystemUsesLightTheme) *lpSystemUsesLightTheme = true;\n\t\t\tif(lpAppsUseLightTheme) *lpAppsUseLightTheme = true;',
              'Personalize defaults')

          p.write_text(s, encoding='utf-8-sig', newline='')

      - name: Validate and commit fixes
        shell: bash
        run: |
          git diff --check
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp src/dll/src/Include/Theme.h
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden Windows menu runtime integration'
          git push
