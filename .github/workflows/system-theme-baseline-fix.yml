name: System theme baseline integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/system-theme-baseline-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Windows the default theme authority
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/dll/src/ContextMenu.cpp')
          s = p.read_text(encoding='utf-8')

          # Remove the stale second system-mode write; final canonical write remains after theme resolution.
          stale = r'(?m)^(\s*)_theme\.system\.transparency = enableTransparency;\n\s*_theme\.system\.mode = systemUsesLightTheme \? 0 : 1;\n'
          s, n = re.subn(stale, r'\1_theme.system.transparency = enableTransparency;\n', s, count=1)
          if n != 1:
              raise SystemExit('stale system mode block mismatch')

          old = '''\t\t\t\tcase ThemeType::Auto:\n\t\t\t\tcase ThemeType::System:\n\t\t\t\tdefault:\n\t\t\t\t{\n\t\t\t\t\tif(isHighContrast)\n\t\t\t\t\t\t_theme = Theme::HighContrast();\n\t\t\t\t\telse\n\t\t\t\t\t{\n\t\t\t\t\t\t_theme = is_dark ? Theme::Dark(false, enableTransparency) : Theme::Light(false, enableTransparency);'''
          new = '''\t\t\t\tcase ThemeType::Auto:\n\t\t\t\tcase ThemeType::System:\n\t\t\t\tdefault:\n\t\t\t\t{\n\t\t\t\t\tif(isHighContrast)\n\t\t\t\t\t\t_theme = Theme::HighContrast();\n\t\t\t\t\telse\n\t\t\t\t\t{\n\t\t\t\t\t\t// Windows owns the baseline. UxTheme values below refine this system palette;\n\t\t\t\t\t\t// NSS configuration is applied afterwards as the explicit override layer.\n\t\t\t\t\t\t_theme = Theme::System();\n\t\t\t\t\t\t_theme.mode = is_dark;'''
          if s.count(old) != 1:
              raise SystemExit('system theme selection block mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='')

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test "$(grep -F -c '_theme.system.mode = systemUsesLightTheme ? 0 : 1;' src/dll/src/ContextMenu.cpp || true)" -eq 0
          grep -Fq '_theme = Theme::System();' src/dll/src/ContextMenu.cpp
          grep -Fq '_theme.system.mode = isHighContrast ? 2 : (systemUsesLightTheme ? 0 : 1);' src/dll/src/ContextMenu.cpp
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add src/dll/src/ContextMenu.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: make Windows theme the default menu baseline'
          git push
