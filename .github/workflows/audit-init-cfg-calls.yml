name: Audit init cfg calls

on:
  push:
    paths:
      - '.github/workflows/audit-init-cfg-calls.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Find init_cfg call sites
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -F 'init_cfg(' -- src/dll/src || true
