name: Windows-owned menu metrics integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/system-menu-metrics.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire system menu metrics into production theme baseline
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/dll/src/ContextMenu.cpp')
          s=p.read_text(encoding='utf-8')
          needle='''\t\t\t\t\t\t_theme = Theme::System();\n\t\t\t\t\t\t_theme.mode = is_dark;'''
          replacement='''\t\t\t\t\t\t_theme = Theme::System();\n\t\t\t\t\t\t_theme.mode = is_dark;\n\n\t\t\t\t\t\t// Windows owns the default geometry for the System/Auto baseline.\n\t\t\t\t\t\t// Capture DPI-aware menu metrics once during menu initialization; explicit\n\t\t\t\t\t\t// NSS theme/view overrides are evaluated later and therefore still win.\n\t\t\t\t\t\tconst auto systemMenuHeight = ::GetSystemMetricsForDpi(SM_CYMENU, dpi.val);\n\t\t\t\t\t\tconst auto systemMenuCheckWidth = ::GetSystemMetricsForDpi(SM_CXMENUCHECK, dpi.val);\n\t\t\t\t\t\tconst auto systemMenuCheckHeight = ::GetSystemMetricsForDpi(SM_CYMENUCHECK, dpi.val);\n\t\t\t\t\t\tif(systemMenuHeight > 0)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tconst auto fontHeight = std::max<long>(1, std::abs(_theme.font.lfHeight));\n\t\t\t\t\t\t\tconst auto verticalSpace = std::max<long>(0, systemMenuHeight - fontHeight);\n\t\t\t\t\t\t\t_theme.back.padding.top = verticalSpace / 2;\n\t\t\t\t\t\t\t_theme.back.padding.bottom = verticalSpace - _theme.back.padding.top;\n\t\t\t\t\t\t}\n\t\t\t\t\t\tif(systemMenuCheckWidth > 0 && systemMenuCheckHeight > 0)\n\t\t\t\t\t\t\t_theme.image.size = static_cast<uint32_t>(std::min(systemMenuCheckWidth, systemMenuCheckHeight));'''
          if s.count(needle)!=1: raise SystemExit('system baseline insertion point mismatch')
          s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8',newline='')
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -Fq 'GetSystemMetricsForDpi(SM_CYMENU, dpi.val)' src/dll/src/ContextMenu.cpp
          grep -Fq 'GetSystemMetricsForDpi(SM_CXMENUCHECK, dpi.val)' src/dll/src/ContextMenu.cpp
          grep -Fq '_theme.image.size = static_cast<uint32_t>(std::min(systemMenuCheckWidth, systemMenuCheckHeight));' src/dll/src/ContextMenu.cpp
          git config user.name ReinierTutoriales
          git config user.email 86568548+ReinierTutoriales@users.noreply.github.com
          git add src/dll/src/ContextMenu.cpp
          git commit -m 'feat: derive system menu geometry from Windows metrics'
          git push
