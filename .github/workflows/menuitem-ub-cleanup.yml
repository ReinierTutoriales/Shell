name: Menu item safety cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/menuitem-ub-cleanup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove undefined empty image accessor
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/dll/src/Include/MenuItem.h')
          s=p.read_text(encoding='utf-8')
          old='''\n\t\t\tHBITMAP get_image()\n\t\t\t{\n\t\t\t}\n'''
          if s.count(old)!=1: raise SystemExit('empty get_image accessor mismatch')
          s=s.replace(old,'\n',1)
          p.write_text(s,encoding='utf-8',newline='')
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test "$(grep -F -c 'HBITMAP get_image()' src/dll/src/Include/MenuItem.h || true)" -eq 0
          grep -Fq 'HBITMAP' src/dll/src/Include/MenuItem.h
          grep -Fq 'hbmpItem;' src/dll/src/Include/MenuItem.h
          git config user.name ReinierTutoriales
          git config user.email 86568548+ReinierTutoriales@users.noreply.github.com
          git add src/dll/src/Include/MenuItem.h
          git commit -m 'fix: remove undefined menu image accessor'
          git push
